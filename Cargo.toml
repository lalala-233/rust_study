[package]
name = "hello_macro"
version = "0.5.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
name = { path = "./name" }
syn = "2.0"
quote = "1.0"
proc-macro2 = "1.0"
clap = { version = "4.4", features = ["derive"] }
is-terminal = "0.4"
indicatif = "0.17"
toml = "0.8"
serde = { features = ["derive"], version = "1.0" }
